<!DOCTYPE HTML>
<html>
<head>
    <title>React Playground - Web App</title>
    <meta charset="utf8" />
    <meta name="content-type" http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Part 1 -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
</head>
<body>
    <div id="root"></div>

</body>
    <!-- Part 2 -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Part 3 and 4 -->
    <script type="text/babel">
        function SumExample({ a, b }) {
            let results = a + b;
            return (
                <p className="SumExample">{ a } + {  b } = { results }</p>
            )
        }

        function SubtractExample({ a, b }) {
            let results = a - b;
            return (
                <p className="SubtractExample">{ a } - {  b } = { results }</p>
            )
        }

        function SumAll({ arr }) {
            let sum = 0;
            for (const num of arr) {
                sum += num;
            }
            return (
                <p className="SumAll"> {arr.join(" + ")} = {sum}</p>
            )
        }

        function MultAll({ arr }) {
            let product = 1;
            for (const num of arr) {
                product *= num
            }
            return (
                <p className="MultAll"> {arr.join(" * ")} = {product}</p>
            )
        }

        function App() {
            return (
                <div className="App">
                    <h1>Hello React World!</h1>
                    <SumExample a={10} b={20}/>
                    <SumExample a={3} b={100}/>
                    
                    <SubtractExample a={10} b={20} />
                    <SumAll arr={[ 10, 20, 30, 40, 50 ]} />
                    <MultAll arr={[ 10, 20, 30, 40, 50 ]} />

                </div>
            );
        }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</html>
