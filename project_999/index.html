<!-- main page -->
<!DOCTYPE HTML>
<html>
<head>
    <title>Carpool Connector - Web App</title>
    <meta charset="utf8" />
    <meta name="content-type" http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Load Bulma CSS Framework -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.0/css/bulma.min.css">

</head>
<body>
    <div id="root"></div>

    <script type="text/babel" src="static/js/Navbar.js"></script>

    <!-- Eveventually display something like -->
    <!-- There are X active members, Y completed routes/miles, Z carbon emission saved, etc  -->
    <script type="text/babel">
        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
      
        function App() {
            return (
                <div>
                    <Navbar />

                    <section className="section">
                        <div className="container">
                            <h1 className="title">Welcome to Carpool Connector!</h1>
                            <p className="subtitle">Your one-stop (or no-stop) solution for a smooth ride!</p>
                            
                            <div className="notification is-primary is-light">
                                <p className="is-size-4 has-text-centered">
                                    Join our growing community! There are currently <strong id="route-count">loading...</strong> active routes available.
                                </p>
                            </div>

                            <hr />

                            <div className="columns">
                                <div className="column">
                                    <div className="content">
                                        <p>
                                            <strong>Carpool Connector</strong> is built for those routes where public transit simply isn't an option. Our platform helps you find the perfect match with minimal detours.
                                        </p>
                                        <p>
                                            By coordinating at common pick-up spots that are convenient for both drivers and riders, we make commuting more affordable and less stressful. Join us in building a community where every seat is filled and every journey is shared!
                                        </p>
                                    </div>
                                </div>
                                <div className="column">
                                    <div className="notification is-info is-light">
                                        <h2 className="subtitle is-2">BART Pick-up Spots</h2>
                                        <ul>
                                            <li>Pleasant Hill/Contra Costa Centre</li>
                                            <li>Walnut Creek</li>
                                            <li>Lafayette</li>
                                            <li>Orinda</li>
                                            <li>Rockridge</li>
                                            <li>12th St Oakland City Center</li>
                                            <li>Lake Merritt</li>
                                            <li>Downtown Hayward</li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>
                </div>
            );
        }

        root.render(<App />);
    </script>
    
    <div class="Map-container">
        <div class="mx-auto" id="map" style="height: 700px; width: 850px;"></div>
    </div>
    
    <script type="module" src="./static/js/setupMap.js"></script>
</body>
</html>
