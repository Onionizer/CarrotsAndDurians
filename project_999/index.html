<!-- main page -->
<!DOCTYPE HTML>
<html>
<head>
    <title>Carpool Connector - Web App</title>
    <meta charset="utf8" />
    <meta name="content-type" http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Load Bulma CSS Framework -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.0/css/bulma.min.css">

    <!-- copied from proj 8 -->
     <!-- maybe remove if Bulma replaces this -->
    <style>
        .App {
            background: #d9ef3222;
            margin: 2vw;
            padding: 2vw;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" src="static/js/Navbar.js"></script>

    <script type="text/babel">
        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
      
        function App() {
            return (
                <div className="App">
                    <Navbar />

                    <section>
                        <h1 className="title">Welcome to Carpool Connector!</h1>
                        <p className="subtitle">Your one-stop (or no-stop) solution for a smooth ride!</p>
                    </section>
                </div>
            );
        }

        root.render(<App />);
    </script>
    
    <div class="mx-auto" id="map" style="height: 700px; width: 850px;"></div>
    <script type="module" src="./static/js/setupMap.js"></script>
</body>
</html>
