<!DOCTYPE HTML>
<html>
<head>
    <title>Carpool Connector - Web App</title>
    <meta charset="utf8" />
    <meta name="content-type" http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Include Leaflet JS / CSS from Project 2-->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""/>
    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>

    <!-- Leaflet Routing Machine - needed for mapping routes -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
    
    <!-- OpenRouteService V2 JavaScript Client SDK -->
    <script type="module"src="https://cdn.jsdelivr.net/npm/openrouteservice-js@0.4.1/dist/ors-js-client.min.js"></script>
    <!-- <script src="https://unpkg.com/lrm-openrouteservice@1.2.0/dist/lrm-openrouteservice.js"></script> -->

    <!-- Firebase App initialization SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <!-- Load Bulma CSS Framework -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.0/css/bulma.min.css">

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- copied from proj 8 -->
    <style>
        .App {
            background: #d9ef3222;
            margin: 2vw;
            padding: 2vw;
        }
    </style>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel" src="static/js/Navbar.js"></script>

    <script type="text/babel">
        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
      
        function App() {
            return (
                <div className="App">
                    <Navbar />
                </div>
            );
        }

        root.render(<App />);
    </script>

</body>
</html>
