<!DOCTYPE HTML>
<html>
<head>
    <title>Carpool Connector - Web App</title>
    <meta charset="utf8" />
    <meta name="content-type" http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Mapbox GL JS Core -->
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.css" rel="stylesheet" />

    <!-- Mapbox Directions Plugin (Handles the routing logic and UI) -->
    <script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-directions/v4.2.0/mapbox-gl-directions.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-directions/v4.2.0/mapbox-gl-directions.css" rel="stylesheet" />


    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- copied from proj 8 -->
    <style>
        .App {
            background: #d9ef3222;
            margin: 2vw;
            padding: 2vw;
        }
    </style>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel" src="static/js/Navbar.js"></script>

    <script type="text/babel">
        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
      
        function App() {
            return (
                <div className="App">
                    <Navbar />
                </div>
            );
        }

        root.render(<App />);
    </script>

    <div class="Address-container">
    <section class="address-card">
        <h2>Home Address</h2>
  
        <div class="Address-field">
            <label for="home-street-address">Street Address</label>
            <input type="text" id="home-street-address" name="home-street-address" placeholder="123 A Street">
            <input type="text" id="home-city" name="home-street-address" placeholder="Berkeley">
            
            <input type="text" id="home-street-address" name="home-street-address" placeholder="e.g., 111 B Street">
            <input type="text" id="home-zip-code" name="home-zip-code" placeholder="12345">
        </div>

    </section>
    
    <section class="address-card">
            <h2>Work Address</h2>

        <!-- button for save/update -->
        <button type="button">
            Update? Cancel button next to this?
        </button>

    </section>


</div>
