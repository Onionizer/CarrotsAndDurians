<!DOCTYPE HTML>
<html>
<head>
    <title>Carpool Connector - Web App</title>
    <meta charset="utf8" />
    <meta name="content-type" http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Include Leaflet JS / CSS from Project 2-->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""/>
    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>


    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- copied from proj 8 -->
    <style>
        .App {
            background: #d9ef3222;
            margin: 2vw;
            padding: 2vw;
        }
    </style>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel" src="static/js/Navbar.js"></script>

    <script type="text/babel">
        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
      
        function App() {
            return (
                <div className="App">
                    <Navbar />
                </div>
            );
        }

        root.render(<App />);
    </script>

    <div class="Address-container">
    <section class="address-card">
        <h2>Home Address</h2>
  
        <label for="full-home-address">Prototype Home Address</label>
        <input type="text" id="full-home-address" name="full-home-address" placeholder="123 A Street">

        <div class="Address-field">
            <label for="home-street-address">Street Address</label>
            <input type="text" id="home-street-address" name="home-street-address" placeholder="123 A Street">
            <input type="text" id="home-city" name="home-street-address" placeholder="Berkeley">
            
            <input type="text" id="home-street-address" name="home-street-address" placeholder="e.g., 111 B Street">
            <input type="text" id="home-zip-code" name="home-zip-code" placeholder="12345">
        </div>

    </section>
    
    <section class="address-card">
        <h2>Work Address</h2>

        <label for="full-work-address">Prototype Work Address</label>
        <input type="text" id="full-work-address" name="full-work-address" placeholder="123 B Street">

        <!-- button for save/update -->
        <button type="button">
            Update? Cancel button next to this?
        </button>

    </section>

    <button id="show-route-button" type="button">
        Show route
    </button>

    <div id="map" style="height: 300px; width: 700px;"></div>
    <script src="./static/js/setupMap.js"></script>

</div>
</body>
</html>
