<!DOCTYPE HTML>
<html>
<head>
    <title>Carpool Connector - Web App</title>
    <meta charset="utf8" />
    <meta name="content-type" http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Include Leaflet JS / CSS from Project 2-->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""/>
    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>

    <!-- Leaflet Routing Machine - needed for mapping routes -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
    
    <!-- OpenRouteService V2 JavaScript Client SDK -->
    <script type="module"src="https://cdn.jsdelivr.net/npm/openrouteservice-js@0.4.1/dist/ors-js-client.min.js"></script>
    <!-- <script src="https://unpkg.com/lrm-openrouteservice@1.2.0/dist/lrm-openrouteservice.js"></script> -->

    <!-- Firebase App initialization SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <!-- Load Bulma CSS Framework -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.0/css/bulma.min.css">


    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- copied from proj 8 -->
    <style>
        .App {
            background: #d9ef3222;
            margin: 2vw;
            padding: 2vw;
        }
    </style>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel" src="static/js/Navbar.js"></script>

    <script type="text/babel">
        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
      
        function App() {
            return (
                <div className="App">
                    <Navbar />
                </div>
            );
        }

        root.render(<App />);
    </script>

    <!--  h1 ~ h6 maps to is-1 ~ is-6 in Bulma  -->
    <div class="Address-container columns">
        <section class="address-card column card">
            <h2>Home</h2>
    
            <label for="full-home-address">Prototype Home Address</label>
            <input type="text" id="full-home-address" name="full-home-address" placeholder="123 A Street">

            <div class="Address-field">
                <label for="home-street-address">Street Address</label>
                <input type="text" id="home-street-address" name="home-street-address" placeholder="Street address">
                
                <!-- Group rest of the address fields -->
                <div class="field is-grouped">
                    <!-- what does is-expanded do? -->
                    <div class="is-expanded">   
                        <input type="text" id="home-city" name="home-street-address" placeholder="Berkeley">
                    </div>
                    <input type="text" id="home-state" name="home-state" placeholder="CA">
                    <input type="text" id="home-zip-code" name="home-zip-code" placeholder="94720">
                </div>

                
            </div>

        </section>
        
        <section class="address-card column card">
            <h2>Work</h2>

            <label for="full-work-address">Prototype Work Address</label>
            <input type="text" id="full-work-address" name="full-work-address" placeholder="123 B Street">

        </section>
    </div>

    <!-- Map and buttons? -->
    <div class="Map-container">
        <!-- Add this somewhere  -->
        <label for="passenger-capacity">Passenger Capacity</label>
        <input type="number" id="passenger-capacity" name="passenger-capacity" placeholder="Maximum number of passengers in your car">

        <button class="is-outlined" id="show-route-button" type="button">
            Show & register route
        </button>

        <!-- TODO: relocate buttons  -->
        <!-- is-centered does not work because it's not a column.  Try mx-auto -->
        <div class="mx-auto" id="map" style="height: 700px; width: 850px;"></div>
        <script type="module" src="./static/js/setupMap.js"></script>

    </div>
</body>
</html>
